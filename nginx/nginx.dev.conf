upstream backend    { server backend:8000; }
upstream hocuspocus { server hocuspocus:1234; }
# В dev frontend — Vite dev server
upstream frontend   { server frontend:5173; }

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # ── Медиа-файлы Django (в dev их отдаёт сам Django) ───────────────────────
    location /media/ {
        proxy_pass         http://backend;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
    }

    # ── Django REST API + Admin ───────────────────────────────────────────────
    location ~ ^/(api|admin|__debug__)/ {
        proxy_pass         http://backend;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
    }

    # ── Django Channels WebSocket ─────────────────────────────────────────────
    location /ws/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $http_host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Hocuspocus WebSocket ──────────────────────────────────────────────────
    # HocuspocusProvider обрезает завершающий слэш, поэтому ловим и /board, и /board/.
    # Имя документа (room_id) передаётся протоколом Hocuspocus, а не путём URL.
    location ^~ /board {
        proxy_pass         http://hocuspocus/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $http_host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        # Отключаем перезапись Location-заголовков от Hocuspocus —
        # иначе nginx убирает порт и редирект уходит на :80.
        proxy_redirect     off;
    }

    # ── Vite dev server + HMR WebSocket ──────────────────────────────────────
    # Vite HMR использует WebSocket на том же порту, поэтому нужны upgrade-заголовки.
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $http_host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}
