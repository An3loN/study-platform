server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Хешированные ассеты Vite неизменяемы — кешируем надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: неизвестный путь отдаём в index.html. Без этого перезагрузка
    # на /lessons/<id>, /invite/<token> или /j/<token> возвращала 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
