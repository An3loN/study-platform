<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Мати">
  <title>Мати</title>
  <!--
    Иконка приложения из макета логотипа: скруглённый квадрат «Неба» и белая
    «М» (Onest ExtraBold, 22px в плитке 32px).

    Буква нарисована контуром, а не текстом: шрифта дизайн-системы на чужой
    машине нет, а иконка вкладки веб-шрифты не подгружает — текстовая «М»
    подставилась бы системной и поехала бы по ширине и насыщенности.

    Пропорции сняты с самого шрифта: высота 0.71em, ширина 0.79em, стойка
    0.17em, средний угол опускается на 77.5% высоты.

    Две тонкости, без которых силуэт «уплывает»:
    — вершина линии поднята до 17.2: остриё стыка (miter) добирает
      недостающее и приходит ровно на нужную глубину;
    — сверху стыки дают шипы выше линии прописных, поэтому буква обрезана
      по своей высоте — так у неё, как и в шрифте, плоские окончания.
  -->
  <clipPath id="cap">
    <rect x="0" y="8.2" width="32" height="15.6"/>
  </clipPath>
  <rect width="32" height="32" rx="8" fill="#1e77ef"/>
  <path d="M9.17 23.8V8.2L16 17.2L22.83 8.2V23.8"
        fill="none" stroke="#ffffff" stroke-width="3.74" stroke-linejoin="miter"
        clip-path="url(#cap)"/>
</svg>
