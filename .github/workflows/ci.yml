name: CI/CD

# Тесты гоняются на каждый push и на каждый pull request. Собирается и
# выкладывается только main: ветка, которая доехала до прода, всегда одна.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/study-platform

jobs:

  # ── Тесты ───────────────────────────────────────────────────────────────────

  backend:
    name: Тесты Django
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: studyplatform
          POSTGRES_USER: studyplatform
          POSTGRES_PASSWORD: studyplatform
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Настройки читаются через decouple: без .env он берёт их из окружения
      SECRET_KEY: ci-secret-not-used-anywhere-else
      POSTGRES_DB: studyplatform
      POSTGRES_USER: studyplatform
      POSTGRES_PASSWORD: studyplatform
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Поставить poetry
        run: pipx install poetry==1.8.5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: poetry
          cache-dependency-path: backend/poetry.lock
      - name: Зависимости
        working-directory: backend
        run: poetry install --no-root
      - name: pytest
        working-directory: backend
        run: poetry run pytest -q

  frontend:
    name: Тесты фронтенда
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      # Сборка здесь не ради артефакта, а ради проверки типов: `npm run build`
      # начинается с tsc, и сломанные типы не должны доезжать до сборки образа
      - run: npm run build
        working-directory: frontend

  hocuspocus:
    name: Тесты hocuspocus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: hocuspocus/package-lock.json
      - run: npm ci
        working-directory: hocuspocus
      - run: npm test
        working-directory: hocuspocus
      - run: npm run build
        working-directory: hocuspocus

  # ── Сборка образов ──────────────────────────────────────────────────────────

  build:
    name: Собрать и выложить образы
    needs: [backend, frontend, hocuspocus]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend, hocuspocus, nginx]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          # Два тега: по коммиту — чтобы деплой был воспроизводим и откат
          # сводился к смене IMAGE_TAG; latest — чтобы `pull` руками на
          # сервере тоже работал
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ── Выкладка ────────────────────────────────────────────────────────────────

  deploy:
    name: Выложить на сервер
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Окружение заводится ради журнала выкладок. Подтверждение перед деплоем
    # (required reviewers) в приватном репозитории доступно только на платных
    # тарифах GitHub — на free оно просто не включится, и выкладка пойдёт сразу
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Ключ и known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Отправить docker-compose.yml
        # Единственный файл проекта, который нужен серверу: всё остальное
        # приезжает образами. `.env` лежит на сервере и не трогается никогда.
        run: |
          scp -P "${{ secrets.SSH_PORT || 22 }}" docker-compose.yml \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/docker-compose.yml"

      - name: Выложить
        run: |
          ssh -p "${{ secrets.SSH_PORT || 22 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd ${{ secrets.DEPLOY_PATH }} && IMAGE_TAG=${{ github.sha }} ./deploy.sh"
