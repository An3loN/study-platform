# Сквозные тесты — отдельным файлом, а не сервисом в dev-стеке.
#
# Образ Playwright весит около двух гигабайт, и тянуть его на каждой машине
# ради разработки незачем: он нужен только тому, кто эти тесты запускает.
# Стек при этом должен быть уже поднят — здесь только браузер.
#
#   docker compose -f docker-compose.dev.yml exec backend python manage.py e2e_seed
#   docker compose -f docker-compose.dev.yml -f docker-compose.e2e.yml run --rm e2e
#   docker compose -f docker-compose.dev.yml exec backend python manage.py e2e_purge

services:
  e2e:
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    working_dir: /e2e
    # Внутри docker-сети до приложения ходят через nginx, а не через localhost
    environment:
      E2E_BASE_URL: http://nginx
      CI: '1'
    volumes:
      - ./e2e:/e2e
    # Кладём node_modules в именованный том: на смонтированной с Windows папке
    # установка идёт втрое дольше и ломается на симлинках
    command: sh -c "npm install --no-audit --no-fund && npx playwright test"
    depends_on:
      - nginx
