# Заголовки безопасности для всех ответов приложения.
#
# Файлом, а не прямо в server: nginx наследует add_header с уровня server
# только в те location, где нет ни одного своего add_header. Поэтому каждый
# location со своими заголовками подключает этот файл заново — иначе он молча
# остаётся без nosniff и HSTS.
add_header X-Frame-Options           "SAMEORIGIN"                      always;
add_header X-Content-Type-Options    "nosniff"                         always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
# Полгода: меньше не имеет смысла, больше — рискованно, пока домен молодой
add_header Strict-Transport-Security "max-age=15768000"                always;
