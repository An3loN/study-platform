upstream backend    { server backend:8000; }
upstream hocuspocus { server hocuspocus:1234; }
upstream frontend   { server frontend:80; }

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript text/xml
        application/json application/javascript application/xml
        image/svg+xml;

    add_header X-Frame-Options    "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff" always;

    # ── Статика Django ────────────────────────────────────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Django REST API + Admin ───────────────────────────────────────────────
    location ~ ^/(api|admin)/ {
        proxy_pass         http://backend;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
    }

    # ── Django Channels WebSocket ─────────────────────────────────────────────
    location /ws/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $http_host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Hocuspocus WebSocket (Excalidraw / Yjs) ───────────────────────────────
    # HocuspocusProvider обрезает завершающий слэш, поэтому ловим и /board, и /board/.
    # Имя документа (room_id) передаётся протоколом Hocuspocus, а не путём URL.
    location ^~ /board {
        proxy_pass         http://hocuspocus/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $http_host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_redirect     off;
    }

    # ── React SPA (catch-all) ─────────────────────────────────────────────────
    location / {
        proxy_pass       http://frontend;
        proxy_set_header Host      $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
