[tool.poetry]
name = "study-platform-backend"
version = "0.1.0"
description = "Study Platform — Django backend"
authors = []
readme = "README.md"
packages = []
package-mode = false

[tool.poetry.dependencies]
python          = "^3.12"
Django          = "5.1.4"
djangorestframework         = "3.15.2"
djangorestframework-simplejwt = "5.3.1"
django-cors-headers         = "4.6.0"
daphne                      = "4.1.2"
psycopg2-binary             = "2.9.10"
celery                      = "5.4.0"
redis                       = "5.2.1"
Pillow                      = "11.1.0"
python-decouple             = "3.8"
qrcode                      = "8.0"

[tool.poetry.group.dev.dependencies]
django-debug-toolbar = "4.4.6"
ipython              = "8.31.0"
pytest               = "8.3.4"
pytest-django        = "4.9.0"
# Статус урока вычисляется из времени — без подмены часов половину случаев
# не проверить
time-machine         = "2.16.0"

[tool.pytest.ini_options]
# Именно --ds, а не ini-опция DJANGO_SETTINGS_MODULE: в образе эта переменная
# окружения выставлена в config.settings.dev и перебила бы ini, а аргумент
# командной строки перебивает переменную. Иначе тесты в контейнере молча
# запускались бы с debug-toolbar.
addopts = "--ds=config.settings.test"
python_files = ["test_*.py"]
testpaths = ["apps"]

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
