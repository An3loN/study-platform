services:

  # ── Reverse proxy ───────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
      - hocuspocus

  # ── React (Vite dev server, hot reload) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      # Монтируем весь проект, а не только src: иначе правки vite.config.ts,
      # index.html и package.json требуют пересборки образа.
      - ./frontend:/app
      - /app/node_modules          # изолируем node_modules от хоста
    environment:
      # Polling нужен для hot reload внутри Docker на Windows/Mac
      CHOKIDAR_USEPOLLING: "true"

  # ── Django (runserver, hot reload) ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      - ./backend:/app
    ports:
      - "8080:8000"    # прямой доступ для отладки
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Hocuspocus (tsx --watch, hot reload) ────────────────────────────────────
  hocuspocus:
    build:
      context: ./hocuspocus
      dockerfile: Dockerfile.dev
    volumes:
      - ./hocuspocus/src:/app/src
      - /app/node_modules
    env_file: .env
    ports:
      - "1234:1234"    # прямой доступ для отладки
    depends_on:
      redis:
        condition: service_healthy

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"    # доступ из IDE / DBeaver
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    # ports:
    #   - "6379:6379"    # доступ из Redis Insight / CLI
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data:
